services:
    postgres:
        build: 
          context: build
          args:
            - PGVERSION=${PGVERSION}
        user: postgres
        command:
          - "postgres"
          - "-c"
          - "wal_level=logical"
          - "-c"
          - "max_replication_slots=10"
          - "-c"
          - "shared_preload_libraries=/opt/dummy_seclabel/dummy_seclabel,pgaudit"
        environment:
            POSTGRES_PASSWORD: ${PGPASSWORD}
        ports:
            # TEST_PGPORT and COMPOSE_PROJECT_NAME allow several test databases at the same time
            - ${TEST_PGPORT:-25432}:5432
        healthcheck:
          test: [ "CMD-SHELL", "pg_isready" ]
          interval: 10s
          timeout: 5s
          retries: 5
