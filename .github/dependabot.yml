# Updates of the Go modules and of the GitHub Actions, once a week, grouped in one pull request each.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"
    # The modules the connection to Google Cloud SQL goes through are not updated here: nothing
    # tests this connection without a Google Cloud account. gocloud.dev 0.49 opens it with another
    # connector, which reads the host of the provider (project/region/instance and the port) as
    # another instance: such an update needs a change of the provider and a test on Cloud SQL.
    ignore:
      - dependency-name: gocloud.dev
      - dependency-name: github.com/GoogleCloudPlatform/cloudsql-proxy
      - dependency-name: google.golang.org/api
      - dependency-name: cloud.google.com/go/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
