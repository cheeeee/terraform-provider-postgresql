# Test the provider against real (and temporary) Google Cloud SQL instances: the
# connection through the Cloud SQL proxy (scheme = "gcppostgres") and the IAM database
# authentication of an impersonated service account, which nothing else tests.
#
# It only runs on demand, for one or several versions of PostgreSQL:
#   gh workflow run gcp-test.yml -f pgversions=17
#   gh workflow run gcp-test.yml -f pgversions="12 13 14 15 16 17 18"
#
# The credentials of Google Cloud come from a service account which only the "gcp-test"
# environment of this repository can use (workload identity federation, no stored key).
# The service account and what it is allowed to do are created by tests/gcp/setup.sh:
# run it once, then give what it prints to the variables of the environment (GCP_PROJECT,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_CONNECT_SERVICE_ACCOUNT).
# Protect the environment with a required reviewer: a run, from any branch, then gets no
# credentials before it is approved.
name: gcp-test

on:
  workflow_dispatch:
    inputs:
      pgversions:
        description: PostgreSQL major versions, separated by spaces (12 to 18)
        required: true
        default: '17'
      cli:
        description: CLI used by the tests
        required: true
        default: both
        type: choice
        options:
          - both
          - terraform
          - opentofu

permissions:
  contents: read

concurrency: gcp-test

env:
  # The versions of the two CLIs: the tests are run the same way with both.
  TERRAFORM_VERSION: '1.15.4'
  OPENTOFU_VERSION: '1.13.9'

jobs:
  plan:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Only the owner of the repository can run this workflow
        if: ${{ github.actor != github.repository_owner }}
        run: exit 1

      - name: The jobs of the run
        id: matrix
        env:
          PGVERSIONS: ${{ inputs.pgversions }}
          CLI: ${{ inputs.cli }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          versions = os.environ["PGVERSIONS"].replace(",", " ").split()
          unknown = [v for v in versions if v not in ("12", "13", "14", "15", "16", "17", "18")]
          if unknown or not versions:
              sys.exit(f"unknown versions: {unknown}")
          clis = ["terraform", "opentofu"] if os.environ["CLI"] == "both" else [os.environ["CLI"]]
          print("matrix=" + json.dumps({"pgversion": versions, "cli": clis}))
          PY

  gcp:
    needs: plan
    name: gcp (${{ matrix.pgversion }}, ${{ matrix.cli }})
    runs-on: ubuntu-latest
    environment: gcp-test
    # The token of GitHub which the cloud exchanges for credentials: this job only
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      PGVERSION: ${{ matrix.pgversion }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_CONNECT_SERVICE_ACCOUNT: ${{ vars.GCP_CONNECT_SERVICE_ACCOUNT }}
      # The name of an instance cannot be used again for a week: every run has its own
      GCP_SUFFIX: ${{ matrix.cli }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Set up Terraform
        if: matrix.cli != 'opentofu'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Use OpenTofu in the tests
        if: matrix.cli == 'opentofu'
        run: echo "E2E_TERRAFORM=tofu" >> "$GITHUB_ENV"

      - name: Credentials of Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Create the Cloud SQL instance
        run: ./tests/gcp_up.sh

      - name: Run the end-to-end test
        run: ./tests/gcp_e2e.sh

      - name: Delete the Cloud SQL instance
        if: always()
        run: ./tests/gcp_down.sh
