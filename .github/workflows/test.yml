name: test

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
  # Once a week with the last version of Terraform and of OpenTofu: what a new version of
  # a CLI or of PostgreSQL breaks is seen without waiting for a change of the code.
  schedule:
    - cron: '41 5 * * 1'

env:
  # The versions of the two CLIs: the tests are run the same way with both. The weekly
  # run takes the last version of each.
  TERRAFORM_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '1.15.4' }}
  OPENTOFU_VERSION: ${{ github.event_name == 'schedule' && 'latest' || '1.13.9' }}

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 19rc1 has to be replaced by 19 as soon as PostgreSQL 19 is released
        pgversion: [19rc1, 18, 17, 16, 15, 14, 13, 12]
        # Everything which goes through the CLI (acceptance and end-to-end tests)
        # is run the same way with Terraform and with OpenTofu.
        cli: [terraform, opentofu]

    env:
      PGVERSION: ${{ matrix.pgversion }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Set up Terraform
        if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      # The acceptance tests and the end-to-end test use Terraform by default.
      - name: Use OpenTofu in the tests
        if: matrix.cli == 'opentofu'
        run: |
          {
            echo "TF_ACC_TERRAFORM_PATH=$(command -v tofu)"
            echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org"
            echo "E2E_TERRAFORM=tofu"
          } >> "$GITHUB_ENV"

      # With act all the jobs of the matrix run on the same Docker host:
      # each one gets its own test database.
      - name: Use a separate test database (act)
        if: ${{ env.ACT }}
        run: |
          version="${{ matrix.pgversion }}"
          port=$((25500 + ${version%%[a-z]*} * 2))
          if [ "${{ matrix.cli }}" = "opentofu" ]; then port=$((port + 1)); fi
          {
            echo "COMPOSE_PROJECT_NAME=tfpg-ci-${version}-${{ matrix.cli }}"
            echo "TEST_PGPORT=${port}"
            echo "TEST_PUBLISHER_PGPORT=$((port + 100))"
          } >> "$GITHUB_ENV"

      - name: test
        run: make test

      - name: vet
        run: make vet

      - name: testacc
        run: make testacc

      - name: teste2e
        run: make teste2e

  # Every release line of the two CLIs (tests/cli_versions.json), on one version of
  # PostgreSQL: what works with a version of a CLI does not depend on the version of
  # PostgreSQL. All of them with all the versions of PostgreSQL is the first step of a
  # release (full-test.yml).
  cli-versions:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: The versions of the CLIs
        id: matrix
        run: echo "matrix=$(python3 scripts/cli_versions.py matrix 17)" >> "$GITHUB_OUTPUT"

  cli:
    needs: cli-versions
    name: cli (${{ matrix.cli }} ${{ matrix.version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cli-versions.outputs.matrix) }}

    env:
      PGVERSION: ${{ matrix.pgversion }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Set up Terraform
        if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      - name: Use OpenTofu in the tests
        if: matrix.cli == 'opentofu'
        run: |
          {
            echo "TF_ACC_TERRAFORM_PATH=$(command -v tofu)"
            echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org"
            echo "E2E_TERRAFORM=tofu"
          } >> "$GITHUB_ENV"

      - name: testacc
        run: make testacc

      - name: teste2e
        run: make teste2e

  # The IAM authentication of the provider (aws_rds_iam_auth, with an assumed role and the
  # region of the token) against Floci, a local emulator of AWS: see tests/floci_iam.sh.
  # The same test runs against a real RDS instance in rds-test.yml.
  aws-iam:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, opentofu]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Set up Terraform
        if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}
          tofu_wrapper: false

      - name: Use OpenTofu in the tests
        if: matrix.cli == 'opentofu'
        run: echo "E2E_TERRAFORM=tofu" >> "$GITHUB_ENV"

      # The AWS CLI and psql are not in the default act image, and with act the two
      # jobs run on the same Docker host: each one gets its own emulator.
      - name: Install the AWS CLI and psql, use a separate emulator (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v aws > /dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
          fi
          if ! command -v psql > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          offset=0
          if [ "${{ matrix.cli }}" = "opentofu" ]; then offset=1; fi
          {
            echo "FLOCI_NAME=tfpg-floci-${{ matrix.cli }}"
            echo "FLOCI_PORT=$((4566 + offset))"
            echo "FLOCI_RDS_PORT=$((7001 + offset))"
          } >> "$GITHUB_ENV"

      - name: IAM authentication against the emulator of AWS
        run: ./tests/floci_iam.sh

  # The test matrix of the README (scripts/test_matrix.py), from the logs of the jobs of
  # this run: it is shown in the summary of the run, and on the main branch it is
  # committed to the README when it changed. Nobody writes it by hand.
  matrix:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test matrix of this run
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/test_matrix.py --run "${{ github.run_id }}" --rds --write README.md --summary "$GITHUB_STEP_SUMMARY"

      - name: The README does not show this matrix
        if: ${{ !env.ACT && github.event_name == 'pull_request' }}
        run: |
          if ! git diff --quiet README.md; then
            echo "::warning title=Test matrix::The test matrix of this run differs from the one of the README: see the summary of the run. It is committed when the pull request is merged."
          fi

      - name: Commit the test matrix
        if: ${{ !env.ACT && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "docs: test matrix" README.md
          # (a push of this token does not start the workflows again)
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main || echo "::warning title=Test matrix::The main branch has moved: the next run updates the matrix."
