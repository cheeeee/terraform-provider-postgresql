name: test

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 19rc1 has to be replaced by 19 as soon as PostgreSQL 19 is released
        pgversion: [19rc1, 18, 17, 16, 15, 14, 13, 12]
        # Everything which goes through the CLI (acceptance and end-to-end tests)
        # is run the same way with Terraform and with OpenTofu.
        cli: [terraform, opentofu]

    env:
      PGVERSION: ${{ matrix.pgversion }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Terraform
        if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.4'
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.cli == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      # The acceptance tests and the end-to-end test use Terraform by default.
      - name: Use OpenTofu in the tests
        if: matrix.cli == 'opentofu'
        run: |
          {
            echo "TF_ACC_TERRAFORM_PATH=$(command -v tofu)"
            echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org"
            echo "E2E_TERRAFORM=tofu"
          } >> "$GITHUB_ENV"

      - name: test
        run: make test

      - name: vet
        run: make vet

      - name: testacc
        run: make testacc

      - name: teste2e
        run: make teste2e
